<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从 OLS 到因果识别 · 中文技术讲义</title><style>
:root{--ink:#20343a;--teal:#145747;--line:#d5ded7;--paper:#fffefb}*{box-sizing:border-box}html{scroll-padding-top:1rem}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.85 'Source Sans 3',system-ui,'Microsoft YaHei',sans-serif}aside{position:fixed;inset:0 auto 0 0;width:280px;background:#f1f4ed;border-right:1px solid var(--line);overflow-y:auto;padding:32px 23px}.brand{font-weight:750;font-size:21px;display:block}.sub{font-size:13px;color:#52675e;display:block;margin-bottom:24px}a{color:var(--teal);text-underline-offset:3px}label{font-size:14px;font-weight:650}input{width:100%;border:1px solid #9aaba0;border-radius:5px;background:white;padding:10px;font-size:15px;margin:5px 0 14px}.chapterlink{display:block;padding:5px 0;font-size:15px}.chapterlink b{display:inline-block;width:28px;color:#658271}aside a{text-decoration:none}aside a:hover,aside a:focus{text-decoration:underline}#results{list-style:none;padding:0;font-size:14px}#results li{padding:4px 0}main{margin-left:280px;padding:48px clamp(24px,5.4vw,94px);max-width:1280px}header{padding-bottom:25px}h1,h2,h3{line-height:1.42;color:#203a30}h1,h2{font-family:'Source Han Serif SC','Noto Serif CJK SC',Georgia,serif}h1{font-size:clamp(32px,4vw,54px);margin:10px 0}h2{font-size:31px;margin:8px 0 18px}h3{font-size:22px;margin:36px 0 12px}.eyebrow{font-size:13px;letter-spacing:.12em;color:#5b7366}.chapter{padding:32px 0;border-top:2px solid var(--line)}p{margin:13px 0}.contents{background:#eff4ec;border-left:3px solid #6c937a;padding:12px 20px}.contents summary{cursor:pointer;font-weight:bold}.contents a{display:block;font-size:15px}math[display=block]{overflow-x:auto;overflow-y:hidden;padding:12px 4px;max-width:100%;margin:16px 0;font-size:1.08em}table{border-collapse:collapse;width:100%;font-size:.9em}td,th{padding:7px;border-bottom:1px solid var(--line)}th{background:#edf3ea;text-align:left}strong{color:#1b453a}footer{border-top:1px solid var(--line);padding:16px 0;font-size:14px}a:focus-visible,input:focus-visible{outline:2px solid #397b61}.back{font-size:14px}@media(max-width:800px){aside{position:static;width:100%;padding:16px}aside nav{display:grid;grid-template-columns:1fr 1fr}.sub{margin-bottom:5px}.chapterlink{font-size:13px}main{margin:0;padding:20px 16px}.chapter{padding:25px 0}}@media print{aside,.back,.contents{display:none}main{margin:0;padding:0}.chapter{break-before:page}h3{break-after:avoid}math{break-inside:avoid}}
</style></head><body><aside aria-label="讲义导航"><a class="brand" href="#home">从 OLS 到因果识别</a><span class="sub">概率基础与政策评估</span><label for="search">搜索章节与正文</label><input type="search" id="search" placeholder="如：平行趋势、弱工具"><div id="status" aria-live="polite"></div><ul id="results"></ul><nav>@@NAV@@</nav></aside><main id="home"><header><span class="eyebrow">计量经济学讲义</span><h1>从 OLS 到因果识别</h1><p>以潜在结果定义处理效应，分别推导随机分配、门槛规则、平行趋势和工具变量假设下的识别式。终章讨论协变量调整、固定效应与方差估计。</p><a href="#c1">第一篇　概率论与统计推断</a></header>@@BODY@@<footer><a href="https://github.com/hi-yuchen/causal-inference-notes">GitHub 仓库与章节源文件</a></footer></main><script>
const input=document.querySelector('#search'),list=document.querySelector('#results'),statusLine=document.querySelector('#status');
const entries=[...document.querySelectorAll('h3')].map(h=>{let text=h.textContent;for(let e=h.nextElementSibling;e&&e.tagName!=='H3';e=e.nextElementSibling)text+=' '+e.textContent;return {h,text:text.toLowerCase()}});
input.addEventListener('input',()=>{list.replaceChildren();const query=input.value.trim().toLowerCase();if(!query){statusLine.textContent='';return}const matches=entries.filter(o=>o.text.includes(query));statusLine.textContent=matches.length?'找到 '+matches.length+' 节':'没有匹配的小节';for(const {h} of matches){const li=document.createElement('li'),a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;li.append(a);list.append(li)}});
</script></body></html>
